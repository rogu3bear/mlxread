# MLXRead — xcodegen project definition.
# Regenerate with: xcodegen generate
#
# Configurable identity lives here in one place:
#   - bundle id prefix / PRODUCT_BUNDLE_IDENTIFIER
#   - DEVELOPMENT_TEAM
name: MLXRead
options:
  bundleIdPrefix: me.jkca
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: NB3G4L6ZD4
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Debug:
      # Debug keeps get-task-allow for the debugger and XCTest injection.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Hardened Runtime is required for notarization and, with a Developer ID
      # (distribution) signature at release time, strips get-task-allow — the
      # concrete fix for TM-001 (process-memory scraping). No extra
      # entitlements are needed: MLXRead uses no JIT / no library-injection,
      # and embedded Sparkle code is signed with the same team.
      ENABLE_HARDENED_RUNTIME: YES

packages:
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    exactVersion: 0.1.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

targets:
  MLXRead:
    type: application
    platform: macOS
    sources:
      - path: MLXRead
    dependencies:
      - package: MLXAudio
        products:
          - MLXAudioTTS
          - MLXAudioCore
      - package: Sparkle
        product: Sparkle
      - target: SystemVoiceProvider
        embed: true
    info:
      path: MLXRead/Resources/Info.plist
      properties:
        CFBundleDisplayName: MLXRead
        CFBundleName: MLXRead
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 James Auchterlonie. MIT licensed."
        # Sparkle auto-update. SUFeedURL and SUPublicEDKey are the only two
        # release-specific values; set them for a published build (see
        # docs/updates.md). An empty SUFeedURL disables update UI at runtime.
        SUFeedURL: "https://raw.githubusercontent.com/OWNER/mlxread/main/appcast.xml"
        SUPublicEDKey: "REPLACE_WITH_generate_keys_PUBLIC_KEY"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jkca.mlxread
        PRODUCT_NAME: MLXRead

  SystemVoiceProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: SystemVoiceProvider
    info:
      path: SystemVoiceProvider/Info.plist
      properties:
        CFBundleDisplayName: MLXRead Voice
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitFactory
          NSExtensionAttributes:
            AudioComponents:
              - description: MLXRead Speech Provider
                manufacturer: JKCA
                name: "JKCA: MLXRead Voice"
                sandboxSafe: true
                subtype: mlxr
                tags:
                  - Synthesizer
                type: ausp
                version: 65536
    entitlements:
      path: SystemVoiceProvider/SystemVoiceProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jkca.mlxread.SystemVoiceProvider
        SKIP_INSTALL: YES

  MLXReadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MLXReadTests
    dependencies:
      - target: MLXRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MLXReadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MLXReadUITests
    dependencies:
      - target: MLXRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MLXRead:
    build:
      targets:
        MLXRead: all
        MLXReadTests: [test]
        MLXReadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MLXReadTests
        - MLXReadUITests
    archive:
      config: Release
