name = "mlxread-web"
main = "build/_worker.js"
compatibility_date = "2026-04-22"
upload_source_maps = true
routes = [{ pattern = "mlxread.com", custom_domain = true }]

[build]
command = "bash ./scripts/build-edge.sh"

[assets]
directory = "./target/site"
binding = "ASSETS"

# No D1 / data layer: MLXRead's product site keeps no account or session state.
